<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="robots" content="noindex">
<title>My Checklist Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header band + content column; dashboard is a tile grid, checklist is a wrapping field of pills. */
:root{
  --bg:#000000; --surface:#0b0b0b; --surface-2:#141414; --line:#1f1f1f; --line-strong:#2e2e2e;
  --text:#f3f3f1; --muted:#8c8c88; --faint:#4a4a47; --accent:#7da7d9; --accent-ink:#04101d;
  --danger:#e5655c; --scrim:rgba(0,0,0,.72);
  --font-ui:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme:dark;
}
:root[data-skin="dark"]{--bg:#141517;--surface:#1b1c1f;--surface-2:#222327;--line:#2a2b30;--line-strong:#383a40;--text:#ececea;--muted:#9a9ba0;--faint:#5b5c62;--accent:#8fb3e6;--accent-ink:#08131f;--scrim:rgba(0,0,0,.6);color-scheme:dark}
:root[data-skin="midnight"]{--bg:#0a1120;--surface:#0f182b;--surface-2:#152038;--line:#1d2a45;--line-strong:#2a3a5c;--text:#e6ecf7;--muted:#8896b3;--faint:#4b5878;--accent:#6fa0ff;--accent-ink:#050d1d;--scrim:rgba(3,7,16,.7);color-scheme:dark}
:root[data-skin="light"]{--bg:#f7f7f5;--surface:#ffffff;--surface-2:#ffffff;--line:#e6e6e2;--line-strong:#d4d4cf;--text:#151515;--muted:#6b6b66;--faint:#b1b1ab;--accent:#2b59c3;--accent-ink:#ffffff;--danger:#c8382f;--scrim:rgba(20,20,20,.35);color-scheme:light}
:root[data-skin="gray"]{--bg:#e8e9eb;--surface:#f2f3f4;--surface-2:#f7f8f9;--line:#d6d8db;--line-strong:#c4c7cb;--text:#1e2226;--muted:#646a71;--faint:#a5aab0;--accent:#46505c;--accent-ink:#ffffff;--danger:#b9423a;--scrim:rgba(30,34,38,.35);color-scheme:light}
:root[data-skin="forest"]{--bg:#0e1913;--surface:#14231a;--surface-2:#1a2d21;--line:#22372a;--line-strong:#2f4a39;--text:#e3eee6;--muted:#8ba596;--faint:#4c6656;--accent:#7fc69a;--accent-ink:#06150c;--scrim:rgba(4,10,6,.7);color-scheme:dark}
:root[data-skin="sand"]{--bg:#f3ece0;--surface:#faf6ee;--surface-2:#fdfaf4;--line:#e5d9c6;--line-strong:#d6c6ad;--text:#2d251b;--muted:#7a6c58;--faint:#bcae98;--accent:#a9652f;--accent-ink:#ffffff;--danger:#b4402f;--scrim:rgba(45,37,27,.35);color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:15px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;transition:background-color .2s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gutter{width:100%;max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .gutter{display:flex;flex-direction:column;gap:10px;padding-block:12px 12px}
.bar-row{display:flex;align-items:center;gap:10px;min-height:42px}
.bar-title{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.bar-title h1{margin:0;font-size:20px;font-weight:700;font-stretch:88%;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title .ico{font-size:20px;line-height:1}
.bar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.meta-row{display:flex;align-items:center;gap:12px;min-height:18px}
.meta{font:500 11.5px/1 var(--font-mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.meta-row .grow{flex:1;min-width:0}
.prog{font:500 13px/1 var(--font-mono);color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog span{color:var(--muted)}
.meter{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s ease}
.countdown{font:500 11.5px/1 var(--font-mono);letter-spacing:.08em;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:7px}
.countdown.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.countdown.reset{color:var(--accent)}
.countdown.off,.countdown.idle{color:var(--faint)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-strong);font-size:12.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn.block{width:100%;height:48px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:var(--muted);border:1px solid transparent;transition:background .15s,color .15s}
.iconbtn.on{color:var(--accent);border-color:var(--line-strong)}
.iconbtn svg,.btn svg{width:20px;height:20px}
@media (hover:hover){.btn:hover{border-color:var(--muted)}.btn.primary:hover{filter:brightness(1.08)}.iconbtn:hover{background:var(--surface-2);color:var(--text)}}
.back{margin-left:-8px}

/* Dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-block:18px 40px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;min-height:138px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;transition:border-color .15s,background .15s,transform .08s;user-select:none}
@media (hover:hover){.tile:hover{border-color:var(--line-strong)}}
.tile:active{transform:scale(.985)}
.tile-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-height:32px}
.tile-ico{font-size:26px;line-height:1}
.tile-more{width:36px;height:36px;margin:-8px -8px 0 0;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.tile-more svg{width:18px;height:18px}
@media (hover:hover){.tile-more:hover{background:var(--surface-2);color:var(--text)}}
.tile-name{font-size:16px;font-weight:650;line-height:1.25;font-stretch:92%;overflow-wrap:anywhere;flex:1}
.tile-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile .meter{height:3px}
.tile.complete .tile-name{color:var(--muted)}
.tile-new{align-items:center;justify-content:center;border-style:dashed;background:transparent;color:var(--muted);font-size:12.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase}
.tile-new svg{width:22px;height:22px}
.arranging .tile{cursor:default}
.arranging .tile:active{transform:none}
.handle{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;border-radius:50%;flex-shrink:0}
.handle svg{width:18px;height:18px}
.tile .handle{margin:-10px -10px 0 0}
.dragging{opacity:.55;outline:1.5px dashed var(--accent);outline-offset:2px}
.empty{padding:56px 0;display:flex;flex-direction:column;align-items:flex-start;gap:14px;max-width:420px}
.empty h2{margin:0;font-size:22px;font-weight:700;font-stretch:90%}
.empty p{margin:0;color:var(--muted);line-height:1.5}

/* Checklist pills */
.pills{display:flex;flex-wrap:wrap;gap:10px;padding-block:18px 56px;align-content:flex-start}
.pill{flex:1 1 auto;max-width:100%;min-height:56px;padding:14px 24px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--text);font-size:15px;font-weight:620;line-height:1.25;font-stretch:94%;letter-spacing:.055em;text-transform:uppercase;text-align:center;overflow-wrap:anywhere;touch-action:manipulation;transition:background-color .18s,color .18s,border-color .18s,transform .08s;will-change:transform}
@media (min-width:700px){.pill{min-height:60px;font-size:16px;padding:16px 28px}}
@media (hover:hover){.pill:hover{border-color:var(--muted)}}
.pill:active{transform:scale(.96)}
.pill.done{background:transparent;border-color:var(--line);color:var(--faint);text-decoration:line-through;text-decoration-thickness:1.5px;font-weight:550}
.pill.done::before{content:"✓";display:inline-block;margin-right:10px;text-decoration:none;color:var(--muted)}
.divider{flex-basis:100%;display:flex;align-items:center;gap:12px;margin-top:12px;font:500 11px/1 var(--font-mono);letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.alldone{flex-basis:100%;font:500 12px/1 var(--font-mono);letter-spacing:.14em;color:var(--accent);text-transform:uppercase;padding:6px 2px 4px}

/* Edit */
.edit{display:flex;flex-direction:column;gap:22px;padding-block:20px 64px;max-width:760px}
.field{display:flex;flex-direction:column;gap:8px}
.label{font:500 11px/1 var(--font-mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.input,.textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:12px 14px;font-size:16px;outline:none;transition:border-color .15s}
.input:focus,.textarea:focus{border-color:var(--accent)}
.textarea{min-height:150px;resize:vertical;line-height:1.5;text-transform:uppercase;letter-spacing:.03em;font-size:15px}
.name-row{display:flex;gap:10px;align-items:stretch}
.icon-btn{width:52px;flex-shrink:0;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);font-size:24px;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:20px;height:20px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.row:focus-within{border-color:var(--line-strong)}
.row-input{flex:1;min-width:0;background:transparent;border:0;outline:none;padding:10px 6px;font-size:15px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-stretch:94%}
.row-input::placeholder{color:var(--faint);text-transform:none;letter-spacing:0;font-weight:400}
.row .iconbtn{flex-shrink:0}
.daytag{flex-shrink:0;font:500 10.5px/1 var(--font-mono);letter-spacing:.08em;color:var(--accent);text-transform:uppercase;padding:6px 8px;border-radius:999px;border:1px solid var(--line-strong);white-space:nowrap}
.edit-actions{display:flex;flex-wrap:wrap;gap:10px}
.hint{color:var(--muted);font-size:13px;line-height:1.45}

/* Dialogs */
.layer{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .15s ease}
.dialog{position:relative;width:min(520px,100%);max-height:min(88vh,760px);overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:18px;animation:rise .18s ease}
.dialog h2{margin:0;font-size:19px;font-weight:700;font-stretch:90%;text-wrap:balance}
.dialog p{margin:0;color:var(--muted);line-height:1.5}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
@media (max-width:560px){
  .layer{align-items:flex-end;padding:0}
  .dialog{width:100%;border-radius:22px 22px 0 0;border-bottom:0;max-height:90vh;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
  .dialog-actions .btn{flex:1}
}
.sheet-list{display:flex;flex-direction:column;gap:6px}
.sheet-item{display:flex;align-items:center;gap:12px;height:50px;padding:0 18px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;text-align:left}
.sheet-item.danger{color:var(--danger)}
@media (hover:hover){.sheet-item:hover{border-color:var(--line-strong)}}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.icon-grid button{height:44px;border-radius:12px;font-size:22px;border:1px solid transparent;display:grid;place-items:center;color:var(--muted)}
.icon-grid button.sel{border-color:var(--accent);background:var(--surface-2)}
.icon-grid button svg{width:18px;height:18px}
@media (hover:hover){.icon-grid button:hover{background:var(--surface-2)}}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.theme{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600;text-align:left}
.theme.sel{border-color:var(--accent)}
.swatch{width:26px;height:26px;border-radius:50%;flex-shrink:0;border:1px solid var(--line-strong);position:relative;overflow:hidden}
.swatch i{position:absolute;right:0;bottom:0;width:50%;height:50%}
.accents{display:flex;flex-wrap:wrap;gap:8px}
.accent{width:36px;height:36px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center;outline-offset:2px}
.accent span{width:24px;height:24px;border-radius:50%;display:block}
.accent.sel{border-color:var(--text)}
.accent.auto span{background:conic-gradient(var(--accent) 0 50%, var(--line-strong) 0)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);font:500 12.5px/1 var(--font-mono);letter-spacing:.04em}
.seg button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.status{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;line-height:1.45;color:var(--muted)}
.status b{color:var(--text);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;background:var(--faint)}
.dot.ok{background:var(--accent)}
.dot.warn{background:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:999px;font:500 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;animation:rise .18s ease}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.toast{animation-name:toastIn}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.hide-sm{display:none}}
</style>
</head>
<body>

<div id="app"></div>
<div id="layer" class="layer" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ---------- Constants ---------- */
const THEMES = [
  {id:"ultra", name:"Ultra Black", bg:"#000000", fg:"#7da7d9"},
  {id:"dark", name:"Dark", bg:"#1b1c1f", fg:"#8fb3e6"},
  {id:"midnight", name:"Midnight Blue", bg:"#0f182b", fg:"#6fa0ff"},
  {id:"light", name:"Light", bg:"#ffffff", fg:"#2b59c3"},
  {id:"gray", name:"Minimal Gray", bg:"#e8e9eb", fg:"#46505c"},
  {id:"forest", name:"Forest Green", bg:"#14231a", fg:"#7fc69a"},
  {id:"sand", name:"Warm Sand", bg:"#f3ece0", fg:"#a9652f"}
];
const ACCENTS = ["#7da7d9","#5fb98a","#d9a24f","#e0665c","#a58ae0","#4fb3b8","#e8e8e4","#2e2e2e"];
const TIMEOUTS = [{m:30,l:"30 min"},{m:60,l:"1 hour"},{m:120,l:"2 hours"},{m:240,l:"4 hours"},{m:0,l:"Off"}];
const ICONS = ["☀️","🌙","🔑","🍳","☕","🎒","🧒","🦷","🛏️","🚿","👕","🧴","💧","🍽️","🧺","🧹","🏠","🛒","💊","🏃","🧘","📚","💼","📋","✈️","🧳","🏍️","🚗","⛽","🔧","📦","🧾","🗓️","🎯","💡","🐶","🌱","🎵","🏖️","❄️"];
const LS_STATE = "checklist-dashboard-v1";
const LS_VIEW = "checklist-dashboard-view";
const SVG = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  drag:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l-4 4 4 4M4 8h16M16 12l4 4-4 4M20 16H4"/></svg>',
  none:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M6.5 17.5l11-11"/></svg>',
  reset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.6"/><path d="M4 4v4.6h4.6"/></svg>'
};

/* ---------- Data model ---------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const blankState = () => ({v:1, lists:[], settings:{theme:"ultra", accent:null, timeoutMin:120}, lastActivity:null, lastResetAt:null, updatedAt:0, migrations:[]});
const DAY_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAY_ORDER = [1,2,3,4,5,6,0];
const normDays = d => { if (!Array.isArray(d)) return null; const x = [...new Set(d.map(Number).filter(n => n >= 0 && n <= 6))]; return x.length && x.length < 7 ? x.sort() : null; };
const dayLabel = d => d && d.length ? DAY_ORDER.filter(n => d.includes(n)).map(n => DAY_SHORT[n]).join(" ") : "";
const today = () => new Date().getDay();
const showsToday = i => !i.days || i.days.includes(today());
function normalize(d){
  const s = blankState();
  if (!d || typeof d !== "object") return s;
  s.lists = Array.isArray(d.lists) ? d.lists.filter(l => l && l.id).map(l => ({
    id:String(l.id), name:String(l.name ?? ""), icon:String(l.icon ?? ""),
    items:Array.isArray(l.items) ? l.items.filter(i => i && i.id).map(i => ({id:String(i.id), text:String(i.text ?? ""), done:!!i.done, doneAt:i.done ? Number(i.doneAt) || 0 : null, days:normDays(i.days)})) : []
  })) : [];
  const st = d.settings || {};
  s.settings.theme = THEMES.some(t => t.id === st.theme) ? st.theme : "ultra";
  s.settings.accent = typeof st.accent === "string" ? st.accent : null;
  s.settings.timeoutMin = TIMEOUTS.some(t => t.m === st.timeoutMin) ? st.timeoutMin : 120;
  s.lastActivity = Number(d.lastActivity) || null;
  s.lastResetAt = Number(d.lastResetAt) || null;
  s.updatedAt = Number(d.updatedAt) || 0;
  s.migrations = Array.isArray(d.migrations) ? d.migrations.map(String) : [];
  return s;
}
const getList = (id, s = S) => s.lists.find(l => l.id === id);
const resetItems = l => { if (l) l.items.forEach(i => { i.done = false; i.doneAt = null; }); };
const anyDone = () => S.lists.some(l => l.items.some(i => i.done));
const visibleOf = l => l.items.filter(showsToday);
const pendingOf = l => visibleOf(l).filter(i => !i.done);
const doneOf = l => visibleOf(l).filter(i => i.done).sort((a, b) => a.doneAt - b.doneAt);
const countDone = l => visibleOf(l).reduce((n, i) => n + (i.done ? 1 : 0), 0);

/* ---------- Store: device cache + shared cloud document ---------- */
let S = blankState();
let view = {screen:"home"};
let arrange = false;
let ready = false, docRef = null, sync = "connecting", dirty = false, writing = false, saveTimer = null, readOnly = false;

function loadLocal(){
  try { const r = localStorage.getItem(LS_STATE); if (r) S = normalize(JSON.parse(r)); } catch (e) {}
  try { const v = JSON.parse(localStorage.getItem(LS_VIEW) || "null"); if (v && (v.screen === "list" || v.screen === "home")) view = v; } catch (e) {}
}
function saveLocal(){ try { localStorage.setItem(LS_STATE, JSON.stringify(S)); } catch (e) {} }
function saveView(){ try { localStorage.setItem(LS_VIEW, JSON.stringify(view.screen === "edit" ? {screen:"list", id:view.id} : view)); } catch (e) {} }

function commit(fn, {activity = false, delay = 200, rerender = true} = {}){
  fn(S);
  if (activity) S.lastActivity = Date.now();
  S.updatedAt = Date.now();
  saveLocal();
  if (rerender) render();
  queueRemote(delay);
}
function queueRemote(delay){
  if (!docRef || readOnly) return;
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, delay);
}
async function flush(){
  if (!docRef || writing || !dirty) return;
  writing = true; dirty = false;
  try {
    await docRef.set(JSON.parse(JSON.stringify(S)));
    setSync("cloud");
  } catch (e) {
    const code = e && e.code;
    if (code === "unavailable") { dirty = true; writing = false; setTimeout(flush, 1200 + Math.random() * 1200); return; }
    if (code === "invalid_argument") { readOnly = true; setSync("readonly"); }
    else setSync("error");
  }
  writing = false;
  if (dirty) flush();
}
function setSync(v){
  if (v !== "connecting" && !ready) { ready = true; setTimeout(checkExpiry, 0); }
  if (sync === v) return; sync = v;
  if (view.screen === "home") render();
  if (dialogRefresh) dialogRefresh();
}

const DEFAULT_LISTS = [
  {name:"Morning routine", icon:"☀️", items:["adri prepare breakfast","adri prepare coffee and tea","kids make the bed","kids Brush teeth, wash face","kids change clothes","kids eat breakfast","adri prepare snack","adri prepare water bottle","adri comb hairs","adri puts sunscreen",{text:"Anton Roller Skates", days:[2]},{text:"Anton Flute", days:[4]}]},
  {name:"Leaving the house", icon:"🔑", items:["Keys","Wallet","Phone","Laptop and charger","Lights off","Windows closed","Door locked"]},
  {name:"Bedtime", icon:"🌙", items:["Kids pajamas","Kids brush teeth","School bags ready","Clothes for tomorrow","Phones charging","Front door locked"]}
];
/* One-time additions to existing saved data (run once per browser, never re-added if deleted later) */
const MIGRATIONS = ["anton-weekday-items"];
function migrate(){
  if (!S.migrations.includes("anton-weekday-items")) {
    commit(s => {
      const l = s.lists.find(x => /morning/i.test(x.name)) || s.lists[0];
      if (l) [["Anton Roller Skates", [2]], ["Anton Flute", [4]]].forEach(([text, days]) => {
        const it = l.items.find(i => i.text.trim().toLowerCase() === text.toLowerCase());
        if (it) it.days = days; else l.items.push({id:uid(), text, done:false, doneAt:null, days});
      });
      s.migrations.push("anton-weekday-items");
    });
  }
}
function connect(){
  // Standalone version: everything is saved in this browser only.
  let stored = null;
  try { stored = localStorage.getItem(LS_STATE); } catch (e) {}
  if (!stored) {
    S.lists = DEFAULT_LISTS.map(l => ({id:uid(), name:l.name, icon:l.icon, items:l.items.map(x => typeof x === "string" ? {id:uid(), text:x, done:false, doneAt:null, days:null} : {id:uid(), text:x.text, done:false, doneAt:null, days:normDays(x.days)})}));
    S.migrations = [...MIGRATIONS];
    S.updatedAt = Date.now(); saveLocal();
  }
  migrate();
  setSync("local");
}

/* ---------- Global inactivity reset ---------- */
function remainingMs(){
  const t = S.settings.timeoutMin;
  if (!t || !S.lastActivity) return null;
  return S.lastActivity + t * 60000 - Date.now();
}
function checkExpiry(){
  if (!ready || !S.settings.timeoutMin || !anyDone()) return;
  const r = remainingMs();
  if (r === null || r > 0) return;
  commit(s => { s.lists.forEach(resetItems); s.lastResetAt = Date.now(); }, {delay:0});
  toast("All checklists reset");
}
const pad = n => String(n).padStart(2, "0");
function fmt(ms){ const s = Math.max(0, Math.ceil(ms / 1000)); return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60); }
const hhmm = t => { const d = new Date(t); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
function countdownState(){
  const t = S.settings.timeoutMin;
  if (!t) return {text:"Auto-reset off", cls:"off"};
  if (anyDone()) { const r = remainingMs(); return {text:"Auto-reset in " + fmt(r === null ? t * 60000 : r), cls:"live"}; }
  if (S.lastResetAt && (!S.lastActivity || S.lastResetAt >= S.lastActivity) && Date.now() - S.lastResetAt < 12 * 3600000)
    return {text:"Reset at " + hhmm(S.lastResetAt), cls:"reset"};
  return {text:"Auto-reset " + fmt(t * 60000), cls:"idle"};
}
function updateCountdown(){
  const c = countdownState();
  document.querySelectorAll("[data-cd]").forEach(el => { if (el.textContent !== c.text) el.textContent = c.text; el.className = "countdown " + c.cls; });
}

function lum(hex){
  const m = hex.replace("#", "").match(/.{2}/g); if (!m) return 0;
  const [r, g, b] = m.map(x => { const v = parseInt(x, 16) / 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  return .2126 * r + .7152 * g + .0722 * b;
}
function applyTheme(){
  const root = document.documentElement;
  if (root.dataset.skin !== S.settings.theme) root.dataset.skin = S.settings.theme;
  const a = S.settings.accent;
  if (a) { root.style.setProperty("--accent", a); root.style.setProperty("--accent-ink", lum(a) > .35 ? "#0a0a0a" : "#ffffff"); }
  else { root.style.removeProperty("--accent"); root.style.removeProperty("--accent-ink"); }
}

function render(){
  applyTheme();
  const f = document.activeElement;
  const focus = f && f.id ? {id:f.id, s:f.selectionStart, e:f.selectionEnd} : null;
  if (view.screen !== "home" && !getList(view.id)) view = {screen:"home"};
  app.innerHTML = view.screen === "home" ? homeHTML() : view.screen === "list" ? listHTML(getList(view.id)) : editHTML(getList(view.id));
  updateCountdown();
  if (focus) { const el = document.getElementById(focus.id); if (el) { el.focus({preventScroll:true}); try { if (focus.s != null) el.setSelectionRange(focus.s, focus.e); } catch (e) {} } }
}

/* FLIP: animate pills from their old positions to new ones */
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
function flipRender(){
  const before = new Map();
  document.querySelectorAll(".pills [data-id]").forEach(el => before.set(el.dataset.id, el.getBoundingClientRect()));
  render();
  if (reduced.matches) return;
  document.querySelectorAll(".pills [data-id]").forEach(el => {
    const b = before.get(el.dataset.id); if (!b) return;
    const a = el.getBoundingClientRect();
    const dx = b.left - a.left, dy = b.top - a.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    el.animate([{transform:`translate(${dx}px,${dy}px)`}, {transform:"none"}], {duration:240, easing:"cubic-bezier(.2,.7,.2,1)"});
  });
}

/* ---------- Operations ---------- */
function go(v){
  if (view.screen === "edit" && !(v.screen === "edit" && v.id === view.id)) pruneEmpty(view.id);
  view = v; arrange = false; saveView(); render(); window.scrollTo(0, 0);
}
function pruneEmpty(id){
  const l = getList(id);
  if (l && l.items.some(i => !i.text.trim())) commit(s => { const x = getList(id, s); x.items = x.items.filter(i => i.text.trim()); }, {rerender:false});
}
function toggleItem(itemId){
  const lid = view.id;
  commit(s => {
    const it = getList(lid, s)?.items.find(i => i.id === itemId); if (!it) return;
    it.done = !it.done; it.doneAt = it.done ? Date.now() : null;
  }, {activity:true, rerender:false, delay:150});
  flipRender();
}
async function resetList(id){
  const l = getList(id); if (!l) return;
  if (!l.items.some(i => i.done)) { toast("Nothing to reset"); return; }
  if (await confirmDialog(`Reset ${l.name || "this checklist"}?`, "All items return to pending in their saved order. Other checklists are not affected.", "Reset")) {
    commit(s => resetItems(getList(id, s)), {activity:true, rerender:false});
    flipRender(); toast("Checklist reset");
  }
}
function cloneList(l){
  return {id:uid(), name:(l.name || "Untitled") + " copy", icon:l.icon, items:l.items.map(i => ({id:uid(), text:i.text, done:false, doneAt:null, days:i.days ? [...i.days] : null}))};
}
function duplicateList(id){
  commit(s => { const i = s.lists.findIndex(l => l.id === id); if (i >= 0) s.lists.splice(i + 1, 0, cloneList(s.lists[i])); });
  toast("Checklist duplicated");
}
async function deleteList(id){
  const l = getList(id); if (!l) return;
  if (await confirmDialog(`Delete ${l.name || "this checklist"}?`, `This removes the checklist and its ${l.items.length} items. This cannot be undone.`, "Delete")) {
    if (view.id === id) view = {screen:"home"};
    commit(s => { s.lists = s.lists.filter(x => x.id !== id); });
    saveView(); toast("Checklist deleted");
  }
}
function editItems(fn, focusId){
  const lid = view.id;
  commit(s => fn(getList(lid, s).items));
  if (focusId) { const el = document.getElementById("it-" + focusId); if (el) { el.focus(); el.scrollIntoView({block:"nearest"}); } }
}
function insertAfter(itemId){
  const nid = uid();
  editItems(items => { const i = items.findIndex(x => x.id === itemId); items.splice(i + 1, 0, {id:nid, text:"", done:false, doneAt:null}); }, nid);
}
function moveItem(itemId, d){
  editItems(items => { const i = items.findIndex(x => x.id === itemId), j = i + d; if (i < 0 || j < 0 || j >= items.length) return; [items[i], items[j]] = [items[j], items[i]]; });
}

let daysItem = null, daysSel = [];
function daysHTML(){
  const it = getList(view.id)?.items.find(i => i.id === daysItem);
  return `<h2>Show on</h2><p>${esc((it && it.text || "Item").toUpperCase())}</p>
    <div class="seg"><button class="${daysSel.length ? "" : "sel"}" data-action="dayAll">Every day</button>${DAY_ORDER.map(n =>
      `<button class="${daysSel.includes(n) ? "sel" : ""}" data-action="dayToggle" data-v="${n}">${DAY_SHORT[n]}</button>`).join("")}</div>
    <div class="dialog-actions"><button class="btn" data-action="dlgCancel">Cancel</button><button class="btn primary" data-action="daysSave">Save</button></div>`;
}
function openDays(itemId){
  const it = getList(view.id)?.items.find(i => i.id === itemId); if (!it) return;
  daysItem = itemId; daysSel = it.days ? [...it.days] : [];
  openDialog(daysHTML(), "Show on");
  dialogRefresh = () => { const d = layer.querySelector(".dialog"); if (d) d.innerHTML = daysHTML(); };
}

const ACTIONS = {
  pickDays(t){ openDays(t.dataset.id); },
  dayAll(){ daysSel = []; dialogRefresh && dialogRefresh(); },
  dayToggle(t){ const n = +t.dataset.v; daysSel = daysSel.includes(n) ? daysSel.filter(x => x !== n) : [...daysSel, n]; dialogRefresh && dialogRefresh(); },
  daysSave(){
    const lid = view.id, iid = daysItem, days = normDays(daysSel);
    closeDialog();
    commit(s => { const it = getList(lid, s)?.items.find(i => i.id === iid); if (it) it.days = days; });
  },
  home(){ go({screen:"home"}); },
  open(t){ if (!arrange) go({screen:"list", id:t.dataset.id}); },
  toggle(t){ toggleItem(t.dataset.id); },
  edit(){ go({screen:"edit", id:view.id}); },
  editDone(){ go({screen:"list", id:view.id}); },
  resetList(t){ resetList(t.dataset.id); },
  arrange(){ arrange = !arrange; render(); },
  settings(){ openSettings(); },
  newList(){ openCreate(); },
  tileMenu(t){
    const id = t.dataset.id, l = getList(id);
    sheet(l.name || "Untitled", [
      {label:"Open", fn:() => go({screen:"list", id})},
      {label:"Edit name, icon and items", fn:() => go({screen:"edit", id})},
      {label:"Duplicate", fn:() => duplicateList(id)},
      {label:"Reset", fn:() => resetList(id)},
      {label:"Delete", danger:true, fn:() => deleteList(id)}
    ]);
  },
  sheetPick(t){ const o = sheetOptions[+t.dataset.i]; closeDialog(); if (o) o.fn(); },
  dlgOk(){ closeDialog(true); },
  dlgCancel(){ closeDialog(false); },
  newIcon(t){ newIcon = t.dataset.icon; document.getElementById("new-icons").innerHTML = iconGrid(newIcon, "newIcon"); },
  createSave(){
    const name = (document.getElementById("new-name").value || "").trim() || "Untitled";
    const items = parseLines(document.getElementById("new-items").value).map(text => ({id:uid(), text, done:false, doneAt:null}));
    const l = {id:uid(), name, icon:newIcon, items};
    closeDialog();
    commit(s => { s.lists.push(l); }, {rerender:false, delay:0});
    go(items.length ? {screen:"list", id:l.id} : {screen:"edit", id:l.id});
    toast(`Created · ${items.length} item${items.length === 1 ? "" : "s"}`);
  },
  pickIcon(){
    const l = getList(view.id);
    openDialog(`<h2>Choose icon</h2>${iconGrid(l.icon, "setIcon")}<div class="dialog-actions"><button class="btn" data-action="dlgCancel">Close</button></div>`, "Choose icon");
  },
  setIcon(t){ const lid = view.id; closeDialog(); commit(s => { getList(lid, s).icon = t.dataset.icon; }); },
  addItem(){
    const nid = uid();
    editItems(items => items.push({id:nid, text:"", done:false, doneAt:null}), nid);
  },
  bulkAdd(){
    const ta = document.getElementById("bulk"); const lines = parseLines(ta.value);
    if (!lines.length) { ta.focus(); return; }
    editItems(items => lines.forEach(text => items.push({id:uid(), text, done:false, doneAt:null})));
    toast(`Added ${lines.length} item${lines.length === 1 ? "" : "s"}`);
  },
  rowMenu(t){
    const id = t.dataset.id, l = getList(view.id), idx = l.items.findIndex(i => i.id === id);
    const it = l.items[idx];
    sheet(it.text || "Item", [
      ...(idx > 0 ? [{label:"Move up", fn:() => moveItem(id, -1)}] : []),
      ...(idx < l.items.length - 1 ? [{label:"Move down", fn:() => moveItem(id, 1)}] : []),
      {label:"Insert item below", fn:() => insertAfter(id)},
      {label:"Duplicate", fn:() => { const nid = uid(); editItems(items => { const i = items.findIndex(x => x.id === id); items.splice(i + 1, 0, {id:nid, text:items[i].text, done:false, doneAt:null, days:items[i].days ? [...items[i].days] : null}); }); }},
      {label:it.days ? "Days: " + dayLabel(it.days) : "Days: every day", fn:() => openDays(id)},
      {label:"Delete", danger:true, fn:() => editItems(items => { const i = items.findIndex(x => x.id === id); if (i >= 0) items.splice(i, 1); })}
    ]);
  },
  dupList(t){ duplicateList(t.dataset.id); },
  delList(t){ deleteList(t.dataset.id); },
  setTheme(t){ commit(s => { s.settings.theme = t.dataset.v; }); dialogRefresh && dialogRefresh(); },
  setAccent(t){ commit(s => { s.settings.accent = t.dataset.v || null; }); dialogRefresh && dialogRefresh(); },
  setTimeout(t){ commit(s => { s.settings.timeoutMin = +t.dataset.v; }); dialogRefresh && dialogRefresh(); checkExpiry(); },
  async resetAll(){
    if (await confirmDialog("Reset all checklists?", "Every item in every checklist returns to pending. Names, items and order are kept.", "Reset all")) {
      commit(s => { s.lists.forEach(resetItems); s.lastActivity = Date.now(); s.lastResetAt = Date.now(); }, {rerender:false});
      view.screen === "list" ? flipRender() : render();
      toast("All checklists reset");
    }
  }
};

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-action]");
  if (!t) { if (e.target.matches("[data-close]")) closeDialog(false); return; }
  const fn = ACTIONS[t.dataset.action];
  if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset && el.dataset.item) {
    const lid = view.id, iid = el.dataset.item, v = el.value;
    commit(s => { const it = getList(lid, s)?.items.find(i => i.id === iid); if (it) it.text = v; }, {rerender:false, delay:700});
  } else if (el.id === "ed-name") {
    const lid = view.id, v = el.value;
    commit(s => { const l = getList(lid, s); if (l) l.name = v; }, {rerender:false, delay:700});
  } else if (el.id === "new-items") {
    const n = parseLines(el.value).length;
    document.getElementById("new-count").textContent = n ? `Items · ${n}` : "Items · one per line";
  }
});
document.addEventListener("keydown", e => {
  const el = e.target;
  if (e.key === "Escape" && !layer.hidden) { closeDialog(false); return; }
  if (el.dataset && el.dataset.item) {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); insertAfter(el.dataset.item); }
    else if (e.key === "Backspace" && el.value === "") {
      e.preventDefault();
      const l = getList(view.id), i = l.items.findIndex(x => x.id === el.dataset.item);
      const prev = l.items[i - 1];
      editItems(items => items.splice(i, 1), prev && prev.id);
      if (prev) { const p = document.getElementById("it-" + prev.id); if (p) p.setSelectionRange(p.value.length, p.value.length); }
    }
  } else if (el.id === "new-items" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { ACTIONS.createSave(); }
  else if (el.id === "new-name" && e.key === "Enter") { e.preventDefault(); document.getElementById("new-items").focus(); }
  else if (el.classList && el.classList.contains("tile") && (e.key === "Enter" || e.key === " ") && el.dataset.action === "open") { e.preventDefault(); ACTIONS.open(el); }
});

/* Drag to reorder (tiles and edit rows), pointer based for touch and mouse */
document.addEventListener("pointerdown", e => {
  const h = e.target.closest("[data-drag]"); if (!h) return;
  const box = h.closest("[data-sortable]"); if (!box) return;
  const kind = box.dataset.sortable, sel = kind === "tiles" ? ".tile[data-id]" : ".row";
  const item = h.closest(sel); if (!item) return;
  e.preventDefault();
  try { h.setPointerCapture(e.pointerId); } catch (_) {}
  item.classList.add("dragging");
  const move = ev => {
    if (ev.clientY < 90) window.scrollBy(0, -12); else if (ev.clientY > innerHeight - 70) window.scrollBy(0, 12);
    const over = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(sel);
    if (!over || over === item || !box.contains(over)) return;
    const all = [...box.querySelectorAll(sel)];
    if (all.indexOf(item) < all.indexOf(over)) over.after(item); else over.before(item);
  };
  const up = () => {
    h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", up); h.removeEventListener("pointercancel", up);
    item.classList.remove("dragging");
    const ids = [...box.querySelectorAll(sel)].map(x => x.dataset.id);
    if (kind === "tiles") commit(s => { s.lists.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id)); });
    else { const lid = view.id; commit(s => { getList(lid, s).items.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id)); }); }
  };
  h.addEventListener("pointermove", move); h.addEventListener("pointerup", up); h.addEventListener("pointercancel", up);
});

/* Timer checks: every second while open, and whenever the page becomes active again */
let shownDay = today();
setInterval(() => { checkExpiry(); updateCountdown(); if (today() !== shownDay) { shownDay = today(); if (view.screen !== "edit" && layer.hidden) render(); } }, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { checkExpiry(); updateCountdown(); } });
window.addEventListener("focus", () => { checkExpiry(); updateCountdown(); });
window.addEventListener("pageshow", () => { checkExpiry(); updateCountdown(); });

/* ---------- Start ---------- */
loadLocal();
render();
checkExpiry();
connect();
</script>
